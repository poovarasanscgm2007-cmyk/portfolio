<!DOCTYPE html>
<html>
<head>
  <title>Poovarasan S - Portfolio</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
    }

    button {
      padding: 10px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #555;
    }
  </style>
</head>

<body>

<header>
  <h1>Poovarasan S</h1>
  <p>Full Stack Developer | Student</p>
</header>

<div class="container">

  <h2>Add Project</h2>
  <div class="card">
    <input type="text" id="title" placeholder="Project Title">
    <textarea id="desc" placeholder="Project Description"></textarea>
    <button onclick="addProject()">Add Project</button>
  </div>

  <h2>My Projects</h2>
  <div id="projects"></div>

</div>

<script>
  let projects = JSON.parse(localStorage.getItem("projects")) || [];

  function displayProjects() {
    let container = document.getElementById("projects");
    container.innerHTML = "";

    projects.forEach((p, index) => {
      container.innerHTML += `
        <div class="card">
          <h3>${p.title}</h3>
          <p>${p.desc}</p>
          <button onclick="deleteProject(${index})">Delete</button>
        </div>
      `;
    });
  }

  function addProject() {
    let title = document.getElementById("title").value;
    let desc = document.getElementById("desc").value;

    if (title === "" || desc === "") {
      alert("Fill all fields!");
      return;
    }

    projects.push({ title, desc });

    localStorage.setItem("projects", JSON.stringify(projects));

    displayProjects();

    document.getElementById("title").value = "";
    document.getElementById("desc").value = "";
  }

  function deleteProject(index) {
    projects.splice(index, 1);
    localStorage.setItem("projects", JSON.stringify(projects));
    displayProjects();
  }

  displayProjects();
</script>

</body>
</html>
